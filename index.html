<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekend Kids</title>
<meta name="description" content="Weekend outings for families, picked for your kids&#x27; ages, the weather and the drive.">
<link rel="canonical" href="https://weekendkids.antarcticasky.com/">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root { color-scheme: light; --bg: #FBF7F0; --card: #FFFFFF; --ink: #1C1A17;
        --ink-soft: #6B635A; --accent: #C2471F; --line: #EDE5DA; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.bar, main { max-width: 680px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
header.site { border-bottom: 1px solid var(--line); }
header.site .bar { display: flex; align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink);
         font-weight: 700; text-decoration: none; }
.brand img { width: 32px; height: 32px; border-radius: 8px; }
header.site nav { margin-left: auto; display: flex; gap: 16px; font-size: 0.95rem; }
main { padding-top: 40px; padding-bottom: 56px; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 1.2rem; margin: 36px 0 8px; }
p, li { color: var(--ink); }
.lede, .meta { color: var(--ink-soft); }
ul { padding-left: 1.2em; }
li { margin: 6px 0; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 16px 20px; margin: 24px 0; }
.home { text-align: center; padding-top: 72px; }
.home .logo { width: 250px; max-width: 80%; height: auto; }
.home .lede { max-width: 30em; margin: 24px auto; font-size: 1.1rem; }
.button { display: inline-block; background: var(--accent); color: #fff; font-weight: 700;
          text-decoration: none; padding: 12px 24px; border-radius: 12px; }
footer { border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 0.9rem; }
footer .bar { padding-top: 16px; padding-bottom: 40px; }
footer p { color: var(--ink-soft); margin: 6px 0; }
</style>
</head>
<body>
<header class="site"><div class="bar">
  <a class="brand" href="./"><img src="icon.png" alt="">Weekend Kids</a>
  <nav><a href="support.html">Support</a><a href="privacy.html">Privacy</a></nav>
</div></header>
<main class="home">
<img class="logo" src="logo.png" alt="Weekend Kids" width="250" height="105">
<p class="lede">Weekend outings for families in Sydney, Melbourne, Brisbane and Perth,
picked for your children's ages, the weather and how far you'll drive.</p>
<p class="meta">Coming soon to the App Store.</p>
</main>
<footer><div class="bar">
  <p><a href="privacy.html">Privacy policy</a> · <a href="support.html">Support</a></p>
  <p>© 2026 Xin Li. Place locations © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>.</p>
</div></footer>
</body>
</html>
